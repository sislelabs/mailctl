{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · mailctl</title>
<script src="/static/htmx.min.js"></script>
<style>
:root {
  --bg: #fbfbfa; --panel: #fff; --ink: #1c1c1a; --muted: #6b6b66;
  --line: #e6e5e1; --accent: #b4522a; --ok: #2f7d52; --warn: #a8760f; --bad: #b3392f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16161a; --panel: #1e1e23; --ink: #ecebe6; --muted: #9b9a93;
    --line: #2e2e35; --accent: #e0895f; --ok: #6cc08c; --warn: #dcae55; --bad: #e8756a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
}
header {
  border-bottom: 1px solid var(--line); padding: .85rem 1.5rem;
  display: flex; align-items: baseline; gap: 1rem; justify-content: space-between;
}
header nav { display: flex; align-items: baseline; gap: .5rem; min-width: 0; }
header .sep { color: var(--line); }
header .crumb { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header a.brand { font-weight: 650; color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
header .sub { color: var(--muted); font-size: .85rem; }
main { max-width: 68rem; margin: 0 auto; padding: 1.5rem; }
h2 { font-size: 1rem; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); margin: 2rem 0 .75rem; }
h2:first-child { margin-top: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
th, td { padding: .7rem .9rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
a { color: var(--accent); }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; }
.pill { display: inline-block; padding: .1rem .45rem; border-radius: 5px; font-size: .72rem; font-weight: 600; }
.pill.problem { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.info { background: color-mix(in srgb, var(--muted) 15%, transparent); color: var(--muted); }
.muted { color: var(--muted); }
form.inline { display: flex; gap: .5rem; padding: .9rem; flex-wrap: wrap; }
select { padding: .45rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
input[type=text] {
  flex: 1 1 12rem; padding: .45rem .6rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit;
}
button {
  padding: .45rem .9rem; border: 1px solid transparent; border-radius: 6px;
  background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
}
button.ghost { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 500; }
button.ghost:hover { color: var(--bad); border-color: var(--bad); }
.err { color: var(--bad); padding: 0 .9rem .7rem; font-size: .88rem; }
.notice { color: var(--warn); padding: 0 .9rem .7rem; font-size: .88rem; }
form.repoint { display: flex; gap: .4rem; align-items: center; margin: 0; }
form.repoint input { flex: 1 1 14rem; padding: .3rem .5rem; font-size: .85rem; }
form.repoint .save { opacity: 0; transition: opacity .12s; padding: .3rem .6rem; font-size: .8rem; }
form.repoint:focus-within .save, form.repoint:hover .save { opacity: 1; }
.empty { padding: 1.5rem .9rem; color: var(--muted); }
.scroll { overflow-x: auto; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.hint { padding: .9rem; color: var(--muted); font-size: .82rem; }
ol.howto { margin: 0; padding: .9rem .9rem .9rem 2.2rem; border-bottom: 1px solid var(--line); }
ol.howto li { padding: .18rem 0; }
b.bad { color: var(--bad); }
button.tiny { padding: .18rem .5rem; font-size: .78rem; }
details summary { cursor: pointer; }
details .reveal { padding: .4rem 0; word-break: break-all; }
.jobhead { display: flex; gap: .6rem; align-items: center; padding: .9rem; border-bottom: 1px solid var(--line); }
.jobfoot { padding: .9rem; border-top: 1px solid var(--line); font-size: .88rem; }
ol.steps { list-style: none; margin: 0; padding: .5rem .9rem; }
ol.steps li { padding: .3rem 0 .3rem 1.4rem; position: relative; }
ol.steps li::before { position: absolute; left: 0; }
ol.steps li.pending::before { content: "\25cb"; color: var(--muted); }
ol.steps li.running::before { content: "\25cf"; color: var(--accent); }
ol.steps li.done::before { content: "\2022"; color: var(--ok); }
ol.steps li.warn::before { content: "\25b3"; color: var(--warn); }
ol.steps li.problem::before { content: "\00d7"; color: var(--bad); }
ol.steps li.pending .label { color: var(--muted); }
.detail { margin-left: .5rem; font-size: .85rem; }
ul.notes { list-style: none; margin: .2rem 0 0; padding: 0 0 0 .2rem; font-size: .85rem; }
ul.notes li { padding: .1rem 0; color: var(--muted); }
ul.notes li.warn { color: var(--warn); }
ul.notes li.problem { color: var(--bad); }
.card.danger { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.dangerhead { padding: .9rem; border-bottom: 1px solid var(--line); font-weight: 650; color: var(--bad); }
.card.danger ul.notes { padding: .9rem; }
.card.danger p.muted { padding: 0 .9rem; font-size: .88rem; }
button.danger { background: var(--bad); }
button.danger-outline { border-color: var(--bad); color: var(--bad); }
.htmx-request .spin { opacity: 1; }
.spin { opacity: 0; transition: opacity .15s; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<header>
  <nav>
    <a class="brand" href="/">mailctl</a>
    {{if .Crumb}}<span class="sep">/</span><span class="crumb mono">{{.Crumb}}</span>{{end}}
  </nav>
  <span class="sub">local panel</span>
</header>
<main>{{template "content" .}}</main>
</body>
</html>{{end}}
